# Nombre de la aplicación
spring.application.name=GestionAulasSpring

# Configuración de la Base de Datos (Datasource con creación automática si no existe)
spring.datasource.url=jdbc:mysql://localhost:3307/gestion-aulas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Publica el frontend almacenado en frontend/ desde la misma API.
spring.web.resources.static-locations=classpath:/static/,file:./frontend/
